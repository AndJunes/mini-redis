[project]
name = "mini-redis"
version = "0.1.0"
description = "Redis-compatible key-value server in pure Python — RESP protocol, TTL expiry, AOF persistence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Junes" }]
requires-python = ">=3.14"
dependencies = []
keywords = ["redis", "resp", "key-value", "database", "cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/AndJunes/mini-redis"
Issues = "https://github.com/AndJunes/mini-redis/issues"

[project.scripts]
mini-redis = "mini_redis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.mypy]
files = ["mini_redis"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
